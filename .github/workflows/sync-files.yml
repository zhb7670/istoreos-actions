name: Sync Files

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 55 15 * * *

# ✅ 添加权限声明，确保 GITHUB_TOKEN 有权写入仓库
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: 准备完成
      uses: actions/checkout@v4

    - name: 下载架构编译配置文件
      run: |
        # iStoreOS 22.03 系列
        mkdir -p ./rk33xx && wget -O ./rk33xx/feeds.conf https://fw0.koolcenter.com/iStoreOS-22.03/r2s/feeds.conf
        wget -O ./rk33xx/.config https://fw0.koolcenter.com/iStoreOS-22.03/r2s/config.buildinfo
        
        mkdir -p ./rk35xx && wget -O ./rk35xx/feeds.conf https://fw0.koolcenter.com/iStoreOS-22.03/h88k/feeds.conf
        wget -O ./rk35xx/.config https://fw0.koolcenter.com/iStoreOS-22.03/h88k/config.buildinfo
        
        mkdir -p ./x86 && wget -O ./x86/feeds.conf https://fw0.koolcenter.com/iStoreOS-22.03/x86_64_efi/feeds.conf
        wget -O ./x86/.config https://fw0.koolcenter.com/iStoreOS-22.03/x86_64_efi/config.buildinfo

        # iStoreOS 23.05 系列 (新增)
        mkdir -p ./rk33xx-23.05 && wget -O ./rk33xx-23.05/feeds.conf https://fw0.koolcenter.com/iStoreOS-23.05/r2s/feeds.conf
        wget -O ./rk33xx-23.05/.config https://fw0.koolcenter.com/iStoreOS-23.05/r2s/config.buildinfo
        
        mkdir -p ./rk35xx-23.05 && wget -O ./rk35xx-23.05/feeds.conf https://fw0.koolcenter.com/iStoreOS-23.05/h88k/feeds.conf
        wget -O ./rk35xx-23.05/.config https://fw0.koolcenter.com/iStoreOS-23.05/h88k/config.buildinfo
        
        mkdir -p ./x86-23.05 && wget -O ./x86-23.05/feeds.conf https://fw0.koolcenter.com/iStoreOS-23.05/x86_64_efi/feeds.conf
        wget -O ./x86-23.05/.config https://fw0.koolcenter.com/iStoreOS-23.05/x86_64_efi/config.buildinfo

        # iStoreOS 24.10 系列
        mkdir -p ./rk33xx-24.10 && wget -O ./rk33xx-24.10/feeds.conf https://fw0.koolcenter.com/iStoreOS/r2s/feeds.conf
        wget -O ./rk33xx-24.10/.config https://fw0.koolcenter.com/iStoreOS/r2s/config.buildinfo
        
        mkdir -p ./rk35xx-24.10 && wget -O ./rk35xx-24.10/feeds.conf https://fw0.koolcenter.com/iStoreOS/h88k/feeds.conf
        wget -O ./rk35xx-24.10/.config https://fw0.koolcenter.com/iStoreOS/h88k/config.buildinfo
        
        mkdir -p ./x86-24.10 && wget -O ./x86-24.10/feeds.conf https://fw0.koolcenter.com/iStoreOS/x86_64_efi/feeds.conf
        wget -O ./x86-24.10/.config https://fw0.koolcenter.com/iStoreOS/x86_64_efi/config.buildinfo

    - name: 同步配置到仓库
      uses: peaceiris/actions-gh-pages@v4
      with:
        # ✅ 修复: 使用标准 GITHUB_TOKEN 解决 403/Not Found 错误
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: main
        publish_dir: ./
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        keep_files: true
        commit_message: "Sync iStoreOS config files"

    - name: 删除运行记录
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3
        token: ${{ secrets.GITHUB_TOKEN }}
