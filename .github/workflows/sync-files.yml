name: Sync Files

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 55 15 * * *

# ✅ 增加权限，确保能将下载的配置推送到仓库
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: 准备完成
      uses: actions/checkout@v4

    - name: 下载架构编译配置文件
      run: |
        # ---------- iStoreOS 22.03 系列 ----------
        # 对应 build-istoreos.yml
        mkdir -p ./rk33xx && wget -O ./rk33xx/feeds.conf https://fw0.koolcenter.com/iStoreOS-22.03/r2s/feeds.conf
        wget -O ./rk33xx/.config https://fw0.koolcenter.com/iStoreOS-22.03/r2s/config.buildinfo
        
        mkdir -p ./rk35xx && wget -O ./rk35xx/feeds.conf https://fw0.koolcenter.com/iStoreOS-22.03/h88k/feeds.conf
        wget -O ./rk35xx/.config https://fw0.koolcenter.com/iStoreOS-22.03/h88k/config.buildinfo
        
        mkdir -p ./x86 && wget -O ./x86/feeds.conf https://fw0.koolcenter.com/iStoreOS-22.03/x86_64_efi/feeds.conf
        wget -O ./x86/.config https://fw0.koolcenter.com/iStoreOS-22.03/x86_64_efi/config.buildinfo

        # ---------- iStoreOS 24.10 (主线) 系列 ----------
        # 对应 build-istoreos-24_10.yml
        mkdir -p ./rk33xx-24.10 && wget -O ./rk33xx-24.10/feeds.conf https://fw0.koolcenter.com/iStoreOS/r2s/feeds.conf
        wget -O ./rk33xx-24.10/.config https://fw0.koolcenter.com/iStoreOS/r2s/config.buildinfo
        
        mkdir -p ./rk35xx-24.10 && wget -O ./rk35xx-24.10/feeds.conf https://fw0.koolcenter.com/iStoreOS/h88k/feeds.conf
        wget -O ./rk35xx-24.10/.config https://fw0.koolcenter.com/iStoreOS/h88k/config.buildinfo
        
        mkdir -p ./x86-24.10 && wget -O ./x86-24.10/feeds.conf https://fw0.koolcenter.com/iStoreOS/x86_64_efi/feeds.conf
        wget -O ./x86-24.10/.config https://fw0.koolcenter.com/iStoreOS/x86_64_efi/config.buildinfo

        # 💡 注意：iStoreOS-23.05 因为官方服务器 404 暂时移除。
        # 如果后续官方上线了 23.05 文件夹，可以参照上方格式添加。

    - name: 同步配置到仓库
      uses: peaceiris/actions-gh-pages@v4
      with:
        # ✅ 使用标准的 GITHUB_TOKEN，避免 403 错误
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: main
        publish_dir: ./
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        keep_files: true
        commit_message: "Sync iStoreOS config files (22.03 & 24.10)"

    - name: 删除运行记录
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3
        token: ${{ secrets.GITHUB_TOKEN }}
